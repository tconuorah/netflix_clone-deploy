# monitoring/04-grafana-dashboard-provisioning.yaml

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    grafana_dashboard: "1"
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: "netflix-dashboards"
        orgId: 1
        folder: "netflix"
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /tmp/dashboards

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  flask-dashboard.json: |
    {
      "uid": "netflix-prom-dashboard",
      "title": "netflix - Prometheus Metrics",
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "10s",
      "panels": [
        {
          "type": "timeseries",
          "title": "Process CPU (seconds/sec)",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "targets": [
            { "expr": "avg(rate(process_cpu_seconds_total[5m]))", "legendFormat": "cpu" }
          ]
        },
        {
          "type": "timeseries",
          "title": "Process Memory (RSS bytes)",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
          "targets": [
            { "expr": "process_resident_memory_bytes", "legendFormat": "rss" }
          ]
        },
        {
          "type": "timeseries",
          "title": "HTTP Requests (req/sec) - if instrumented",
          "gridPos": { "x": 0, "y": 8, "w": 24, "h": 8 },
          "targets": [
            { "expr": "sum(rate(http_requests_total[5m]))", "legendFormat": "req/s" }
          ]
        }
      ]
    }
