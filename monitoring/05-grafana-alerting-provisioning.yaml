# monitoring/05-grafana-alerting-provisioning.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting-provisioning
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
data:
  alerting.yaml: |
    apiVersion: 1

    groups:
      - orgId: 1
        name: NetflixAppCPUAlerts
        folder: Netflix
        interval: 1m
        rules:
          - uid: netflix_cpu_over_80
            title: Netflix App CPU > 80% (of requested CPU)
            condition: C
            data:
              - refId: A
                datasourceUid: prometheus
                relativeTimeRange:
                  from: 300
                  to: 0
                model:
                  expr: |
                    100 *
                    (
                      sum(rate(container_cpu_usage_seconds_total{namespace="default",pod=~"netflix-.*",container="netflix"}[5m]))
                      /
                      sum(kube_pod_container_resource_requests{namespace="default",pod=~"netflix-.*",container="netflix",resource="cpu"})
                    )
                  intervalMs: 1000
                  maxDataPoints: 43200
              - refId: C
                datasourceUid: __expr__
                model:
                  type: classic_conditions
                  conditions:
                    - evaluator:
                        params:
                          - 80
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - A
                      reducer:
                        type: last
                      type: query
            noDataState: NoData
            execErrState: Error
            for: 2m
            annotations:
              summary: "Netflix pod CPU usage above 80% of requested CPU"
            labels:
              severity: warning
            notification_settings:
              receiver: grafana-default
